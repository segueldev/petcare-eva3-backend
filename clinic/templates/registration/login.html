{% extends 'clinic/base.html' %}
{% block title %}Iniciar sesión · PetCare{% endblock %}
{% block content %}
<section class="login panel">
  <h1>Iniciar sesión</h1>
  <p class="muted">Agenda veterinaria y fichas clínicas.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
